server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy HTTP API calls to the server service
    location ~ ^/(bots|games) {
        proxy_pass         http://server:3001;
        proxy_http_version 1.1;
        # WebSocket upgrade headers — nginx passes the upgrade if the client requests it
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;  # keep WS connections alive
    }

    # SPA fallback — any unmatched path serves index.html for React Router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
