# Usage: docker compose -f docker-compose.dev.yml up
#
# Hot-reload dev setup: source is bind-mounted; no image rebuilds needed.
# node_modules stay inside the container (anonymous volume masks the bind mount).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dojochess
      POSTGRES_USER: dojochess
      POSTGRES_PASSWORD: dojochess
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
      - ./packages/server/src/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dojochess"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    image: node:22-alpine
    working_dir: /app
    command: npx tsx watch packages/server/src/index.ts
    environment:
      DATABASE_URL: postgresql://dojochess:dojochess@postgres:5432/dojochess
      PORT: 3001
    volumes:
      - .:/app
      - server_modules:/app/node_modules
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    # Install deps on startup if node_modules is empty
    entrypoint: >
      sh -c "
        [ -d node_modules/.bin ] || npm install &&
        npx tsx watch packages/server/src/index.ts
      "

  client:
    image: node:22-alpine
    working_dir: /app
    environment:
      # Vite listens on all interfaces so Docker can expose the port
      HOST: 0.0.0.0
    volumes:
      - .:/app
      - client_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - server
    entrypoint: >
      sh -c "
        [ -d node_modules/.bin ] || npm install &&
        npx vite packages/client --host
      "

volumes:
  pgdata_dev:
  server_modules:
  client_modules:
